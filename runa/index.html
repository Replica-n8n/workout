<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101215">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<title>Runa</title>
</head>
<body>

<canvas id="carte" aria-label="Carte du quartier et de la boucle proposée"></canvas>

<div id="installe" hidden>
  <span class="quoi">Installer Runa</span>
  <button class="oui" id="installer">Installer</button>
  <button class="non" id="plus-tard" aria-label="Plus tard">&#10005;</button>
</div>

<div id="etat" role="status" hidden>
  <span id="etat-texte"></span>
  <span id="etat-barre" hidden><i></i></span>
</div>

<section id="panneau">

  <div id="reglages">
    <div class="ligne">
      <span class="nom">Départ<span class="sous" id="depart-quoi">pas encore défini</span></span>
      <button class="secondaire" id="ma-position">Ma position</button>
    </div>

    <p class="titre">Durée</p>
    <div class="chips" id="durees" role="group" aria-label="Durée de la sortie"></div>

    <div class="ligne">
      <span class="nom">Allure</span>
      <button class="rond" id="allure-moins" aria-label="Dix secondes de moins au kilomètre">&minus;</button>
      <span class="val" id="allure-val">6:00</span>
      <button class="rond" id="allure-plus" aria-label="Dix secondes de plus au kilomètre">+</button>
    </div>

    <button class="option" id="opt-feux" aria-pressed="true">
      <span class="coche" aria-hidden="true">&check;</span>
      <span class="nom">Éviter les feux
        <span class="sous">Préfère les petites rues aux grands axes</span></span>
    </button>

    <button class="option" id="opt-nuit" aria-pressed="false">
      <span class="coche" aria-hidden="true">&check;</span>
      <span class="nom">Rues éclairées
        <span class="sous">Pour courir de nuit</span></span>
    </button>

    <button class="principal" id="chercher">Trouver trois boucles</button>
    <p class="pied" id="astuce" hidden>Touchez la carte pour déplacer le départ.</p>
  </div>

  <div id="resultats" hidden>

    <div id="choix">
      <p class="titre" id="resume"></p>
      <div id="boucles"></div>
      <button class="principal" id="suivre">Suivre ce parcours</button>
      <div class="rangee">
        <button class="secondaire" id="autres">Trois autres</button>
        <button class="secondaire" id="retour">Réglages</button>
      </div>
    </div>

    <div id="course" hidden>
      <p id="suivi"></p>
      <button class="secondaire" id="quitter">Changer de parcours</button>
    </div>

  </div>

</section>

<div id="secours" hidden>
  <b>L’application n’a pas pu démarrer.</b>
  <button id="reparer">Réparer et recharger</button>
</div>

<!-- ⚠️ Ce script n'est PAS un module, exprès : si `js/app.js` échoue à
     charger, un module ne s'exécuterait pas non plus, et l'app resterait un
     HTML mort sans rien pour s'en sortir. Vu en vrai après une mise à jour
     où le cache servait deux versions mélangées. -->
<script>
(function () {
  var demarre = false;
  window.addEventListener('runa-demarre', function () { demarre = true; });
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName === 'SCRIPT') montrer();
  }, true);
  setTimeout(function () { if (!demarre) montrer(); }, 4000);

  function montrer() { document.getElementById('secours').hidden = false; }

  document.getElementById('reparer').addEventListener('click', function () {
    var fini = function () { location.replace(location.pathname + '?r=' + Date.now()); };
    var taches = [];
    if (window.caches) taches.push(caches.keys().then(function (ks) {
      return Promise.all(ks.map(function (k) { return caches.delete(k); }));
    }));
    if (navigator.serviceWorker) taches.push(
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    Promise.all(taches).then(fini, fini);
  });
})();
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>
