<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GVT Tracker</title>
<meta name="description" content="Suivi de séances German Volume Training : une série à la fois, repos chronométré, charge et disques calculés. Fonctionne hors ligne.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcf8fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131315">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GVT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/gvt.css">
</head>
<body>

<p class="sr-only" id="annonce" role="status" aria-atomic="true"></p>

<div class="topbar" id="update-bar" hidden>
  <span>Une nouvelle version est prête.</span>
  <button type="button" id="update-btn">Recharger</button>
</div>

<div class="app" id="app" data-phase="serie">

  <header class="tete">
    <button class="pilule" type="button" id="ouvrir-seance" aria-haspopup="dialog"></button>
    <button class="rond" type="button" id="ouvrir-reglages" aria-haspopup="dialog" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/></svg>
    </button>
  </header>

  <nav class="exos" id="exos" aria-label="Exercices de la séance"></nav>

  <!-- SÉRIE : la série se lit sur un disque, de la couleur du plus lourd sur la barre -->
  <main class="ecran serie" id="ecran-serie">
    <h1 class="nom" id="nom"></h1>
    <div class="disque" id="disque-serie">
      <!-- width/height 0 en attributs : sans le CSS (ancien cache), le SVG ne
           s'affiche pas en grand disque noir. -->
      <svg class="disque-svg" viewBox="0 0 200 200" width="0" height="0" aria-hidden="true" focusable="false"></svg>
      <p class="insert" id="compteur"><b id="num"></b><small id="sur"></small></p>
    </div>
    <div class="pastilles" id="pastilles" role="group" aria-label="Type de disques de la salle">
      <button type="button" class="pastille" data-disques="couleur" aria-pressed="true" aria-label="Disques de couleur"><i></i></button>
      <button type="button" class="pastille" data-disques="fonte" aria-pressed="false" aria-label="Disques en fonte"><i></i></button>
    </div>
    <p class="presc" id="presc"></p>
    <div id="bloc-charge"></div>
    <div id="bloc-fin"></div>
    <div class="pousse"></div>
    <button class="gros" type="button" id="action" data-action-principale></button>
  </main>

  <!-- REPOS : le même disque se vide au fil du temps -->
  <section class="ecran repos" id="ecran-repos" aria-label="Repos">
    <h1 class="nom">Repos</h1>
    <div class="disque" id="disque-repos">
      <svg class="disque-svg" viewBox="0 0 200 200" width="0" height="0" aria-hidden="true" focusable="false"></svg>
      <p class="insert" aria-hidden="true"><b class="temps" id="temps-1">00:00</b><small>repos</small></p>
    </div>
    <p class="sr-only" id="temps-lu"></p>
    <div class="repos-bas">
      <div class="ensuite"><span>Ensuite</span><b id="ensuite"></b></div>
      <div class="actions">
        <button type="button" id="plus15">+15 s</button>
        <button type="button" class="passer" id="passer">Passer le repos</button>
      </div>
      <button type="button" class="annuler" id="annuler"></button>
    </div>
  </section>
</div>

<dialog class="feuille" id="reglages" aria-labelledby="reglages-titre">
  <div class="feuille-corps">
  <div class="feuille-tete">
    <h2 id="reglages-titre">Réglages</h2>
  </div>

  <section class="bloc" id="bloc-rm">
    <h3 id="rm-titre"></h3>
    <div class="rm-ligne">
      <button type="button" class="pas" id="rm-moins" aria-label="Retirer 5 lb au 1RM">−5</button>
      <label class="rm-champ"><span class="sr-only">1RM en livres</span>
        <input type="number" id="rm" inputmode="numeric" min="0" max="1500" step="5" placeholder="1RM">
        <span aria-hidden="true">lb</span>
      </label>
      <button type="button" class="pas" id="rm-plus" aria-label="Ajouter 5 lb au 1RM">+5</button>
    </div>
    <div class="rm-apercu" id="rm-apercu"></div>
  </section>

  <section class="bloc">
    <h3>Séance</h3>
    <div class="options" id="seances"></div>
  </section>

  <section class="bloc">
    <button type="button" class="large ton" id="vider">Vider les séries de cette séance</button>
    <button type="button" class="large ton" id="install" hidden>Installer sur l'écran d'accueil</button>
    <p class="note" id="install-ios" hidden>Pour l'installer : <strong>Partager</strong>, puis « Sur l'écran d'accueil ».</p>
    <p class="note" id="version"></p>
  </section>
  </div>

  <!-- Fermer EN BAS, sous le pouce : un bouton en haut d'une feuille qui
       monte du bas oblige à changer de prise. -->
  <div class="feuille-pied"><button type="button" class="gros" id="fermer" data-action-principale>Fermer</button></div>
</dialog>

<script type="module" src="js/gvt.js"></script>
</body>
</html>
